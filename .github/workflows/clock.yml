name: "打卡"

# 触发方式（三路并行，互不冲突）：
#   1. schedule  —— 云端定时，不依赖本机开机（主力）
#   2. workflow_dispatch —— 手动，或本机开机脚本调用
#   3. 脚本自身去重 —— 当天已有记录就跳过，所以触发多次也只产生一条
on:
  workflow_dispatch:
  schedule:
    # ⚠️ cron 一律按 UTC，北京时间 = UTC + 8。
    # ⚠️ GitHub 定时任务常延迟 10~60 分钟，偶尔跳过，所以同一时段排多次，
    #    靠「今日已有记录则跳过」去重 —— 多触发不会多打，只是提高至少成功一次的几率。
    # 早上 07:00~09:00 之间排 4 次
    - cron: "00 23 * * *"   # UTC 23:00 -> 北京 07:00
    - cron: "30 23 * * *"   # UTC 23:30 -> 北京 07:30
    - cron: "00 00 * * *"   # UTC 00:00 -> 北京 08:00
    - cron: "30 00 * * *"   # UTC 00:30 -> 北京 08:30
    # 中午再兜 2 次（万一早上全失败）
    - cron: "00 04 * * *"   # UTC 04:00 -> 北京 12:00
    - cron: "00 06 * * *"   # UTC 06:00 -> 北京 14:00

concurrency:
  group: gxy-clockin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install depend
      run: |
        python -m pip install --upgrade pip
        pip install certifi cffi charset-normalizer cryptography idna
        pip install numpy opencv-python-headless pycparser requests urllib3

    - name: Start sign
      env:
        USER: ${{ secrets.USER }}
        # 必须显式设为北京时间：容器默认 UTC，脚本用本地时间做日期判断，
        # 不设置会导致跨零点时「今天」算错一天。
        TZ: Asia/Shanghai
      run: |
        python index.py
