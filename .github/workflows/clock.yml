name: "打卡"

# 触发方式：仅手动 + 开机（由本机计划任务在登录后调用 API 触发）
# 每天只要一条记录：脚本自身会查今日记录，已有则直接跳过，
# 所以即使一天触发多次，实际最多只产生一条打卡记录。
on:
  workflow_dispatch:

concurrency:
  group: gxy-clockin
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.8
      uses: actions/setup-python@v4
      with:
        python-version: '3.8'

    - name: Install depend
      run: |
        python -m pip install --upgrade pip
        pip install certifi cffi charset-normalizer cryptography idna
        pip install numpy opencv-python-headless pycparser requests urllib3

    - name: Start sign
      env:
        USER: ${{ secrets.USER }}
        # 必须显式设为北京时间：容器默认 UTC，脚本用本地时间做日期判断，
        # 不设置会导致跨零点时「今天」算错一天。
        TZ: Asia/Shanghai
      run: |
        python index.py
